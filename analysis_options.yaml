# Analysis configuration for db_explorer_app
#
# Balanced industry-standard configuration
# Based on flutter_lints with practical additions
# (F_AISUBCRIBE standardından ui_lints custom rules çıkarılmıştır —
# bunlar F_AISUBCRIBE'in video subtitle app'ine özel kurallardı.)

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.gr.dart"
    - build/**
  language:
    strict-inference: true
    strict-raw-types: true
  strong-mode:
    implicit-casts: false
    implicit-dynamic: false

  errors:
    # Treat missing required parameters as errors
    missing_required_param: error
    # Treat missing returns as errors
    missing_return: error
    # TODOs are info, not warnings
    todo: info
    # Deprecated usage as warnings
    deprecated_member_use: warning

linter:
  rules:
    # ERROR PREVENTION - Critical rules to prevent bugs
    - avoid_empty_else
    - avoid_print
    - avoid_relative_lib_imports
    - avoid_types_as_parameter_names
    - cancel_subscriptions
    - close_sinks
    - no_duplicate_case_values
    - no_logic_in_create_state
    - use_build_context_synchronously
    - use_key_in_widget_constructors
    - valid_regexps

    # PERFORMANCE - Flutter-specific optimizations
    - avoid_unnecessary_containers
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - sized_box_for_whitespace
    - use_colored_box
    - use_decorated_box

    # CODE QUALITY - Readability and maintainability
    - always_declare_return_types
    - annotate_overrides
    - avoid_init_to_null
    - avoid_redundant_argument_values
    - avoid_renaming_method_parameters
    - avoid_return_types_on_setters
    - await_only_futures
    - camel_case_extensions
    - camel_case_types
    - curly_braces_in_flow_control_structures
    - empty_catches
    - empty_constructor_bodies
    - exhaustive_cases
    - file_names
    - hash_and_equals
    - implementation_imports
    - library_names
    - library_prefixes
    - null_closures
    - prefer_collection_literals
    - prefer_conditional_assignment
    - prefer_contains
    - prefer_final_fields
    - prefer_for_elements_to_map_fromIterable
    - prefer_if_null_operators
    - prefer_is_empty
    - prefer_is_not_empty
    - prefer_iterable_whereType
    - prefer_single_quotes
    - prefer_spread_collections
    - require_trailing_commas
    - sort_child_properties_last
    - unnecessary_brace_in_string_interps
    - unnecessary_const
    - unnecessary_new
    - unnecessary_null_in_if_null_operators
    - unnecessary_overrides
    - unnecessary_this
    - use_full_hex_values_for_flutter_colors
    - use_function_type_syntax_for_parameters
    - use_rethrow_when_possible
    - use_super_parameters
    - void_checks
