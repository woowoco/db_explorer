name: db_explorer_app
description: "Extensible Cross-Platform Database Workbench + AI Query Assistant. MVP: MongoDB provider, AI Query Copilot (no write authority)."
publish_to: none

# Tolga'nın kişisel projelerinde kullandığı versiyonlama şeması:
# <major>.<minor>.<patch>+<build>
# Phase 6: Redis + Elasticsearch providers (mock + real) (build 7).
version: 0.7.0+7

environment:
  sdk: ^3.12.2

dependencies:
  # Flutter SDK
  flutter:
    sdk: flutter

  # State Management (F_AISUBCRIBE tutarlılığı — flutter_bloc + Cubit)
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^9.0.0

  # Routing — go_router (kullanıcı kararı, F_AISUBCRIBE'in custom Navigator'ı değil)
  go_router: ^14.6.2

  # Responsive (F_AISUBCRIBE standard)
  flutter_screenutil: ^5.9.3

  # UI / iconography
  cupertino_icons: ^1.0.8

  # Path & file system
  path: ^1.9.1
  path_provider: ^2.1.5

  # Logger
  logger: ^2.6.2

  # Stream combinators
  rxdart: ^0.28.0

  # Database — MongoDB (mvp provider)
  mongo_dart: ^0.10.8  # Phase 3 — real driver (pure-Dart)

  # Database — PostgreSQL (Phase 5+ provider)
  postgres: ^3.5.0  # Phase 5 — pure-Dart PG driver (isoos/stablekernel)

  # Database — Redis (Phase 6+ provider)
  redis: ^4.0.0  # Phase 6 — pure-Dart RESP protocol client (TLS + pubsub + transactions)

  # Database — Elasticsearch (Phase 6+ provider)
  elastic_client: ^0.3.15  # Phase 6 — Dart bindings for ES HTTP API (isoos)

  # Code editor (query editor için) — Phase 4 devreye girdi.
  # `highlight` paketi (language Mode tanımları) doğrudan dependency olarak
  # eklenmeli (depend_on_referenced_packages lint) — flutter_code_editor da
  # aynı major'ı kullanır.
  flutter_code_editor: ^0.3.4
  highlight: ^0.7.0

  # Storage — Phase 0 stub'lar gerçek binding kullanır (smoke test için).
  flutter_secure_storage: ^10.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3

  # Utilities
  # file_picker: ^8.x (Phase 0'da gerek yok; connection string için manual text field yeterli)
  intl: ^0.19.0
  # permission_handler: ^12.x (Phase 0'da gerek yok)

  # AI local inference — DEFERRED to Phase 7 (llamadart veya llm_llamacpp).
  # Phase 0 stubs AI provider interfaces'i implement eder, gerçek binding yok.

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

  flutter_lints: ^6.0.0

  # build_runner ^2.4.13 pinning (F_AISUBCRIBE ile tutarlı; hive_generator_io uyumu).
  # Phase 0'da kullanılmıyor; Phase 2+ (Hive adapters) için hazır.
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  # Phase 0 assets — Poppins font (F_AISUBCRIBE'den kopyalanır).
  # Connection profile export/import (Phase 2+) için ileride eklenebilir.
  assets:
    - assets/fonts/google-poppins/

  # Font Configuration — Poppins (TOLGA standardı, F_AISUBCRIBE ile uyumlu).
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/google-poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/google-poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/google-poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/google-poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/google-poppins/Poppins-Black.ttf
          weight: 900
